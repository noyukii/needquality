name: CI

on:
  pull_request:
  push:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: python scripts/eval.py --check
      - run: python -m py_compile scripts/*.py

  agent-skills-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install
          "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate every skill against the Agent Skills spec
        run: |
          set -euo pipefail
          for skill in "$GITHUB_WORKSPACE"/skills/*/; do
            echo "validating ${skill}"
            skills-ref validate "${skill}"
          done
